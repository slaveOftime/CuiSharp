name: GitHub Pages

on:
  pull_request:
    # The Pages tree is built by a separate pipeline from the solution; a browser regression
    # should be caught before merge. These runs are build checks only: the deploy job below
    # is gated to tag refs, because Pages is published when a release goes out.
    paths:
      - 'samples/CuiSharp.Gallery.Browser/**'
      - 'src/CuiSharp/**'
      - 'native/**'
      - 'tools/build-cui-wasm.ps1'
      - 'tools/test-browser-smoke.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Called by release.yml after a release is published — the only path that deploys Pages.
  workflow_call:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install browser workloads
        working-directory: samples/CuiSharp.Gallery.Browser
        run: dotnet workload install wasm-tools wasm-experimental

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install the CDP smoke-test client
        run: python -m pip install --disable-pip-version-check websocket-client

      - name: Build CUI for wasm32
        shell: pwsh
        run: pwsh tools/build-cui-wasm.ps1 -TargetFramework net10.0

      - name: Publish browser gallery
        working-directory: samples/CuiSharp.Gallery.Browser
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force '../../artifacts/pages' -ErrorAction SilentlyContinue
          dotnet publish CuiSharp.Gallery.Browser.csproj `
            --configuration Release --output ../../artifacts/pages
          $site = Join-Path (Resolve-Path '../../artifacts/pages') 'wwwroot'
          if (-not (Test-Path (Join-Path $site 'index.html'))) {
            throw "WebAssembly publish did not produce $site/index.html"
          }
          # Pages compresses .wasm at the edge; publishing SDK sidecars duplicates these assets.
          Get-ChildItem $site -Recurse -File -Include '*.gz', '*.br' | Remove-Item -Force
          New-Item -ItemType File -Force (Join-Path $site '.nojekyll') | Out-Null
          $bytes = (Get-ChildItem $site -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Pages payload after removing redundant sidecars: $bytes bytes"

      - name: Smoke-test the exact Pages tree in headless Chrome (both renderers)
        run: |
          python tools/test-browser-smoke.py artifacts/pages/wwwroot --renderer webgl2
          python tools/test-browser-smoke.py artifacts/pages/wwwroot --renderer 2d

      - uses: actions/configure-pages@v5
        if: github.ref_type == 'tag'

      - uses: actions/upload-pages-artifact@v4
        if: github.ref_type == 'tag'
        with:
          path: artifacts/pages/wwwroot

  deploy:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
