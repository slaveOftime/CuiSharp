name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'samples/**'
      - 'native/**'
      - 'skills/**'
      - 'tools/**'
      - 'bindings/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '*.slnx'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'samples/**'
      - 'native/**'
      - 'skills/**'
      - 'tools/**'
      - 'bindings/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '*.slnx'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The suite draws real frames through the native library, so it needs CUI built
  # first (many tests fail with DllNotFoundException without it). Every leg builds CUI
  # for its own backend and runs the whole suite: nothing needs a display, the frames go
  # through CUI's software renderer. Linux needs the X11 headers to compile the backend.
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install X11 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Submodule revision
        id: cui
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD:native/CUI)" >> $env:GITHUB_OUTPUT

      - name: Cache the native build
        id: native-cache
        uses: actions/cache@v4
        with:
          # Keyed on the submodule commit: a new CUI means a new native build, and nothing else does.
          path: |
            native/cui.dll
            native/cui.lib
            native/libcui.so
            native/libcui.a
            native/libcui.dylib
          key: cui-native-${{ runner.os }}-${{ steps.cui.outputs.sha }}

      - name: Build CUI (native library)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CUI_GLIBC_BASELINE: '2.35'
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      - name: Restore
        run: dotnet restore CuiSharp.slnx

      - name: Build
        run: dotnet build CuiSharp.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test CuiSharp.slnx --configuration Release --no-build

      # The other formatting gate: a build succeeds on formatted-looking code that
      # `dotnet format` would rewrite.
      - name: Format
        if: runner.os == 'Windows'
        run: dotnet format CuiSharp.slnx --verify-no-changes

      # The public surface is the approval file, so a pull request that changes it prints the diff
      # where the reviewer already is. `PublicSurfaceTests` fails when the file is stale; this shows
      # what changed.
      - name: Public surface diff
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: pwsh
        continue-on-error: true
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }} 2>$null
          $diff = git diff origin/${{ github.base_ref }} -- docs/API-SURFACE.txt
          if (-not $diff) { Write-Host 'the public surface did not change'; exit 0 }

          '## The public surface changed' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          'Reviewed in `docs/API-SURFACE.txt`; 1.0 makes it a promise.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```diff' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $diff | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append

  # The template content is not in the solution, so nothing else compiles it.
  # Scaffold it under a name that is not CuiSharp.* — a namespace-only difference
  # used to hide a missing using directive — and build that. Each OS packs the
  # library with its own native build, so the scaffolded app runs the backend it
  # will actually ship with.
  template:
    name: Template scaffolds and builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install X11 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Build CUI (native library)
        shell: pwsh
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      - name: Pack the library and the template
        run: |
          dotnet pack src/CuiSharp/CuiSharp.csproj -c Release -o artifacts/packages
          dotnet pack src/CuiSharp.Templates/CuiSharp.Templates.csproj -c Release -o artifacts/packages

      - name: Scaffold and build a project from it
        shell: pwsh
        run: |
          $feed = (Resolve-Path artifacts/packages).Path
          dotnet new uninstall CuiSharp.Templates 2>$null | Out-Null
          dotnet new install (Get-ChildItem artifacts/packages/CuiSharp.Templates*.nupkg).FullName

          $app = Join-Path $env:RUNNER_TEMP 'scaffold'
          dotnet new cui-app -n Contoso.App -o $app

          # CuiSharp is not on nuget.org yet, so point the new project at the feed.
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="local" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content (Join-Path $app 'nuget.config')

          dotnet build $app -c Release -warnaserror

  # Proves the whole chain per platform: build CUI from source, then publish the
  # gallery as a single NativeAOT executable with CUI linked in, and run it headless.
  native-aot:
    name: NativeAOT single file (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: CuiGallery.exe
          - os: ubuntu-22.04
            rid: linux-x64
            exe: CuiGallery
          - os: macos-latest
            rid: osx-arm64
            exe: CuiGallery
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Submodule revision
        id: cui
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD:native/CUI)" >> $env:GITHUB_OUTPUT

      - name: Cache the native build
        id: native-cache
        uses: actions/cache@v4
        with:
          # Keyed on the submodule commit: a new CUI means a new native build, and nothing else does.
          path: |
            native/cui.dll
            native/cui.lib
            native/libcui.so
            native/libcui.a
            native/libcui.dylib
          key: cui-native-${{ runner.os }}-${{ steps.cui.outputs.sha }}

      - name: Build CUI (native library)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CUI_GLIBC_BASELINE: '2.35'
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      - name: Publish
        run: dotnet publish samples/CuiSharp.Gallery -c Release -r ${{ matrix.rid }} -o artifacts/publish

      # The size ceiling is a row in docs/PERFORMANCE.md: cheap to check, and deterministic.
      - name: Size budget
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: pwsh tools/budget-check.ps1 -AotBytes (Get-Item 'artifacts/publish/${{ matrix.exe }}').Length

      - name: Assert the exe is self-contained
        shell: pwsh
        run: |
          $exe = 'artifacts/publish/${{ matrix.exe }}'
          if (-not (Test-Path $exe)) { throw "missing $exe" }

          if ($IsWindows) {
            . ./native/msvc-env.ps1  # dumpbin
            $deps = & dumpbin /dependents $exe 2>$null | Select-String '\.dll'
            foreach ($forbidden in 'cui.dll', 'VCRUNTIME', 'MSVCP', 'coreclr', 'hostfxr') {
              if ($deps -match [regex]::Escape($forbidden)) { throw "unexpected dependency: $forbidden" }
            }
          } elseif ($IsMacOS) {
            # A static CUI leaves only the system libraries; a dynamic libcui here means
            # the archive was not linked in.
            $deps = otool -L $exe
            Write-Host ($deps -join "`n")
            if ($deps -match 'libcui') { throw 'libcui was not linked in' }
          } else {
            # The x11 leg: the archive must be inside the executable, and GL is dlopened.
            $deps = ldd $exe
            Write-Host ($deps -join "`n")
            if ($deps -match 'libcui') { throw 'libcui was not linked in' }
            if (-not ($deps -match 'libX11')) { throw 'the x11 backend was not linked in' }
          }
          if (Test-Path 'artifacts/publish/libcui.dylib') { throw 'libcui.dylib was not linked in' }
          if (Test-Path 'artifacts/publish/cui.dll') { throw 'cui.dll was not linked in' }

          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "${{ matrix.exe }} = $mb MB"

      - name: Smoke test (headless render)
        shell: pwsh
        run: |
          # A WinExe does not make PowerShell wait on Windows, so the screenshot and
          # the exit code would both be read before the app has run. On macOS the
          # published binary is an ordinary executable and waits like any command.
          Push-Location artifacts/publish
          try {
            $env:CUI_SCREENSHOT = 'smoke.png'
            $env:CUI_SCREENSHOT_FRAMES = '8'
            if ($IsWindows) {
              $app = Start-Process -FilePath ./CuiGallery.exe -ArgumentList '--page=0' -Wait -PassThru
              $exit = $app.ExitCode
            } else {
              ./CuiGallery --page=0
              $exit = $LASTEXITCODE
            }
            if ($exit -ne 0) { throw "app exited $exit" }
            if (-not (Test-Path 'smoke.png')) { throw 'no screenshot produced' }
            if ((Get-Item 'smoke.png').Length -lt 10KB) { throw 'screenshot looks empty' }
          }
          finally { Pop-Location }
          Write-Host 'headless render OK'

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cui-gallery-${{ matrix.rid }}
          path: |
            artifacts/publish/${{ matrix.exe }}
            artifacts/publish/smoke.png

  # Frame time on demand. The harness is stable enough to compare two runs on one machine and not
  # stable enough to fail a pull request from a shared runner, so it runs when a person asks for it:
  # Actions -> CI -> Run workflow. Both ceilings come from docs/PERFORMANCE.md.
  budget:
    name: Frame budget (on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Submodule revision
        id: cui
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD:native/CUI)" >> $env:GITHUB_OUTPUT

      - name: Cache the native build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            native/cui.dll
            native/cui.lib
          key: cui-native-${{ runner.os }}-${{ steps.cui.outputs.sha }}

      - name: Build CUI (native library)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./native/build-native.ps1

      - name: Measure and compare
        shell: pwsh
        run: |
          dotnet run -c Release --project src/CuiSharp.Benchmarks -- --fps 900 |
            Tee-Object -FilePath benchmark.txt
          pwsh tools/budget-check.ps1 -Benchmark benchmark.txt

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: benchmark
          path: benchmark.txt

  # The package is what users get, so one job meets it the way they do: pack, scaffold from
  # the package, build, test, publish a NativeAOT single file and drive it. run on the oldest
  # image the package promises (glibc 2.35) as well as Windows, so an ABI that a newer runner
  # would hide fails here.
  packaged-consumer:
    name: Packaged consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install X11 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Submodule revision
        id: cui
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD:native/CUI)" >> $env:GITHUB_OUTPUT

      - name: Cache the native build
        id: native-cache
        uses: actions/cache@v4
        with:
          # Keyed on the submodule commit: a new CUI means a new native build, and nothing else does.
          path: |
            native/cui.dll
            native/cui.lib
            native/libcui.so
            native/libcui.a
            native/libcui.dylib
          key: cui-native-${{ runner.os }}-${{ steps.cui.outputs.sha }}

      - name: Build CUI (native library)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CUI_GLIBC_BASELINE: '2.35'
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      # Packs into a private cache, scaffolds from the package, tests (JIT frames through
      # the software renderer), publishes AOT, checks the executable is alone in its
      # folder, and drives the result with `dotnet cui`.
      - name: Verify the template from the package
        shell: pwsh
        run: ./tools/verify-template.ps1

  # Benchmarks are a regression signal, not a gate: the JSON reports are uploaded
  # so a reviewer can compare a run against the previous one.
  #
  # One leg per benchmark family, in parallel: BenchmarkDotNet starts a fresh
  # process per case, so a serial run of all 51 cases took 18 minutes and almost
  # none of it was the code under test. The legs are shaped so the slowest is a
  # couple of minutes (ScaleBenchmarks' nine param combinations are the long pole,
  # so each of its benchmarks gets its own leg).
  benchmarks:
    name: Benchmarks (${{ matrix.os }} · ${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # A leg per benchmark family, on each OS. Spelled out because `include`
      # entries that lack a matrix key are merged into the first combination, not
      # crossed with it — five legs silently became one.
      matrix:
        include:
          - os: windows-latest
            leg: frame
            filter: ['*FrameBuildBenchmarks*', '*MarshallingBenchmarks*']
          - os: windows-latest
            leg: virtual-list
            filter: ['*ScaleBenchmarks.VirtualList*']
          - os: windows-latest
            leg: chart-raw
            filter: ['*ScaleBenchmarks.ChartRaw*']
          - os: windows-latest
            leg: chart-decimated
            filter: ['*ScaleBenchmarks.ChartDecimated*']
          - os: windows-latest
            leg: decimate-only
            filter: ['*ScaleBenchmarks.DecimateOnly*']
          - os: macos-latest
            leg: frame
            filter: ['*FrameBuildBenchmarks*', '*MarshallingBenchmarks*']
          - os: macos-latest
            leg: virtual-list
            filter: ['*ScaleBenchmarks.VirtualList*']
          - os: macos-latest
            leg: chart-raw
            filter: ['*ScaleBenchmarks.ChartRaw*']
          - os: macos-latest
            leg: chart-decimated
            filter: ['*ScaleBenchmarks.ChartDecimated*']
          - os: macos-latest
            leg: decimate-only
            filter: ['*ScaleBenchmarks.DecimateOnly*']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build native
        shell: pwsh
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      # No --job: the suites carry [SimpleJob], and a CLI --job is *added* to those,
      # so every case ran twice. The iteration counts trim that one job instead:
      # BenchmarkDotNet's per-case process start costs far more than the runs.
      - name: Run benchmarks
        shell: pwsh
        run: >
          dotnet run --project src/CuiSharp.Benchmarks -c Release --
          --filter ${{ join(matrix.filter, ' ') }} --warmupCount 2 --iterationCount 5
          --exporters json github

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.leg }}
          path: BenchmarkDotNet.Artifacts/results/

  # Fails the build if the checked-in bindings drift from the pinned CUI headers:
  # regenerating from the submodule must reproduce every generated file byte for
  # byte, and the generated layout tests pin each struct's size and field offsets.
  # (The old C probe this job ran is gone; bindgen takes the same numbers from
  # libclang, and the native jobs prove them against a real cui.dll.)
  abi:
    name: ABI unchanged
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Regenerate from the pinned headers and verify
        run: pwsh tools/regen.ps1 -NoNative -NoDiff -NoTest

