name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'samples/**'
      - 'native/**'
      - 'skills/**'
      - 'Directory.Build.props'
      - '*.slnx'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'samples/**'
      - 'native/**'
      - 'skills/**'
      - 'Directory.Build.props'
      - '*.slnx'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The suite draws real frames through the native library, so it needs CUI built
  # first (many tests fail with DllNotFoundException without it). Windows and macOS
  # build CUI and run the whole suite; the Linux leg compiles everything, which is
  # the platform-specific part in managed code (interop signatures, ref struct
  # rules, analyzers) — the ubuntu image carries no X11 headers, so CUI's x11
  # backend cannot build there (PLAN §5).
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build CUI (native library)
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      - name: Restore
        run: dotnet restore CuiSharp.slnx

      - name: Build
        run: dotnet build CuiSharp.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test CuiSharp.slnx --configuration Release --no-build

  # The template content is not in the solution, so nothing else compiles it.
  # Scaffold it under a name that is not CuiSharp.* — a namespace-only difference
  # used to hide a missing using directive — and build that. Each OS packs the
  # library with its own native build, so the scaffolded app runs the backend it
  # will actually ship with.
  template:
    name: Template scaffolds and builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build CUI (native library)
        shell: pwsh
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      - name: Pack the library and the template
        run: |
          dotnet pack src/CuiSharp/CuiSharp.csproj -c Release -o artifacts/packages
          dotnet pack src/CuiSharp.Templates/CuiSharp.Templates.csproj -c Release -o artifacts/packages

      - name: Scaffold and build a project from it
        shell: pwsh
        run: |
          $feed = (Resolve-Path artifacts/packages).Path
          dotnet new uninstall CuiSharp.Templates 2>$null | Out-Null
          dotnet new install (Get-ChildItem artifacts/packages/CuiSharp.Templates*.nupkg).FullName

          $app = Join-Path $env:RUNNER_TEMP 'scaffold'
          dotnet new cui-app -n Contoso.App -o $app

          # CuiSharp is not on nuget.org yet, so point the new project at the feed.
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="local" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content (Join-Path $app 'nuget.config')

          dotnet build $app -c Release -warnaserror

  # Proves the whole chain per platform: build CUI from source, then publish the
  # gallery as a single NativeAOT executable with CUI linked in, and run it headless.
  native-aot:
    name: NativeAOT single file (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: CuiGallery.exe
          - os: macos-latest
            rid: osx-arm64
            exe: CuiGallery
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build CUI (native library)
        shell: pwsh
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      - name: Publish
        run: dotnet publish samples/CuiSharp.Gallery -c Release -r ${{ matrix.rid }} -o artifacts/publish

      - name: Assert the exe is self-contained
        shell: pwsh
        run: |
          $exe = 'artifacts/publish/${{ matrix.exe }}'
          if (-not (Test-Path $exe)) { throw "missing $exe" }

          if ($IsWindows) {
            . ./native/msvc-env.ps1  # dumpbin
            $deps = & dumpbin /dependents $exe 2>$null | Select-String '\.dll'
            foreach ($forbidden in 'cui.dll', 'VCRUNTIME', 'MSVCP', 'coreclr', 'hostfxr') {
              if ($deps -match [regex]::Escape($forbidden)) { throw "unexpected dependency: $forbidden" }
            }
          } else {
            # A static CUI leaves only the system libraries; a dynamic libcui here means
            # the archive was not linked in.
            $deps = otool -L $exe
            Write-Host ($deps -join "`n")
            if ($deps -match 'libcui') { throw 'libcui was not linked in' }
          }
          if (Test-Path 'artifacts/publish/libcui.dylib') { throw 'libcui.dylib was not linked in' }
          if (Test-Path 'artifacts/publish/cui.dll') { throw 'cui.dll was not linked in' }

          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "${{ matrix.exe }} = $mb MB"

      - name: Smoke test (headless render)
        shell: pwsh
        run: |
          # A WinExe does not make PowerShell wait on Windows, so the screenshot and
          # the exit code would both be read before the app has run. On macOS the
          # published binary is an ordinary executable and waits like any command.
          Push-Location artifacts/publish
          try {
            $env:CUI_SCREENSHOT = 'smoke.png'
            $env:CUI_SCREENSHOT_FRAMES = '8'
            if ($IsWindows) {
              $app = Start-Process -FilePath ./CuiGallery.exe -ArgumentList '--page=0' -Wait -PassThru
              $exit = $app.ExitCode
            } else {
              ./CuiGallery --page=0
              $exit = $LASTEXITCODE
            }
            if ($exit -ne 0) { throw "app exited $exit" }
            if (-not (Test-Path 'smoke.png')) { throw 'no screenshot produced' }
            if ((Get-Item 'smoke.png').Length -lt 10KB) { throw 'screenshot looks empty' }
          }
          finally { Pop-Location }
          Write-Host 'headless render OK'

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cui-gallery-${{ matrix.rid }}
          path: |
            artifacts/publish/${{ matrix.exe }}
            artifacts/publish/smoke.png

  # Benchmarks are a regression signal, not a gate: the JSON reports are uploaded
  # so a reviewer can compare a run against the previous one.
  #
  # One leg per benchmark family, in parallel: BenchmarkDotNet starts a fresh
  # process per case, so a serial run of all 51 cases took 18 minutes and almost
  # none of it was the code under test. The legs are shaped so the slowest is a
  # couple of minutes (ScaleBenchmarks' nine param combinations are the long pole,
  # so each of its benchmarks gets its own leg).
  benchmarks:
    name: Benchmarks (${{ matrix.os }} · ${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - leg: frame
            filter: ['*FrameBuildBenchmarks*', '*MarshallingBenchmarks*']
          - leg: virtual-list
            filter: ['*ScaleBenchmarks.VirtualList*']
          - leg: chart-raw
            filter: ['*ScaleBenchmarks.ChartRaw*']
          - leg: chart-decimated
            filter: ['*ScaleBenchmarks.ChartDecimated*']
          - leg: decimate-only
            filter: ['*ScaleBenchmarks.DecimateOnly*']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build native
        shell: pwsh
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          else { bash native/build-native.sh }

      # No --job: the suites carry [SimpleJob], and a CLI --job is *added* to those,
      # so every case ran twice. The iteration counts trim that one job instead:
      # BenchmarkDotNet's per-case process start costs far more than the runs.
      - name: Run benchmarks
        shell: pwsh
        run: >
          dotnet run --project src/CuiSharp.Benchmarks -c Release --
          --filter ${{ join(matrix.filter, ' ') }} --warmupCount 2 --iterationCount 5
          --exporters json github

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.leg }}
          path: BenchmarkDotNet.Artifacts/results/

  # Fails the build if the checked-in bindings drift from the pinned CUI headers:
  # regenerating from the submodule must reproduce every generated file byte for
  # byte, and the generated layout tests pin each struct's size and field offsets.
  # (The old C probe this job ran is gone; bindgen takes the same numbers from
  # libclang, and the native jobs prove them against a real cui.dll.)
  abi:
    name: ABI unchanged
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Regenerate from the pinned headers and verify
        run: pwsh tools/regen.ps1 -NoNative -NoDiff -NoTest

