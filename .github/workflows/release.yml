name: Publish to NuGet

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0 (overrides Directory.Build.props)'
        required: false

permissions:
  contents: write
  id-token: write # NuGet trusted publishing / OIDC

jobs:
  pack:
    name: Pack and verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout CUI
        uses: actions/checkout@v4
        with:
          repository: yappologistic/CUI
          path: CUI

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native artifacts (packed into the package)
        shell: pwsh
        run: ./native/build-native.ps1

      - name: Test
        run: dotnet test CuiSharp.slnx -c Release

      - name: Pack templates
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          $args = @('pack', 'src/CuiSharp.Templates/CuiSharp.Templates.csproj', '-c', 'Release', '-o', 'artifacts/packages')
          if ($version) { $args += "-p:Version=$version" }
          dotnet @args

      - name: Pack
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          $args = @('pack', 'src/CuiSharp/CuiSharp.csproj', '-c', 'Release', '-o', 'artifacts/packages')
          if ($version) { $args += "-p:Version=$version" }
          dotnet @args

      - name: Inspect the package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem artifacts/packages/*.nupkg | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $names = $zip.Entries.FullName
            $names | Sort-Object | Write-Host
            foreach ($required in 'runtimes/win-x64/native/cui.dll', 'runtimes/win-x64/native/cui.lib', 'build/CuiSharp.targets', 'README.md') {
              if ($names -notcontains $required) { throw "package is missing $required" }
            }
          } finally { $zip.Dispose() }
          Write-Host "package OK: $($nupkg.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*

  publish:
    name: Push to NuGet
    needs: pack
    runs-on: windows-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      # Recommended: NuGet trusted publishing. Add a NUGET_USER secret for the
      # nuget.org account name; no long-lived API key is stored.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        shell: pwsh
        run: |
          Get-ChildItem packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE) { throw "push failed for $($_.Name)" }
          }

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/*.nupkg
            packages/*.snupkg
