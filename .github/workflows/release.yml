name: Publish to NuGet

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0 (overrides Directory.Build.props)'
        required: false

permissions:
  contents: write
  id-token: write # NuGet trusted publishing / OIDC

jobs:
  # Everything below exists to publish these packages, so ask nuget.org whether it will
  # accept us before spending five native builds on it. The OIDC exchange needs the
  # same claims the real push will present, so this job uses the same environment and
  # the same account name.
  preflight:
    name: Can we log in to nuget.org
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: slaveoftime

      - name: Report
        run: |
          # The key itself is deliberately not printed; a working exchange is the signal.
          echo "nuget.org issued a publishing key for slaveoftime" >> $GITHUB_STEP_SUMMARY

  # CUI is built per platform, so the package can carry every RID's native assets:
  # x64 and ARM64 on their own Windows/Linux runners, and osx-arm64 on macOS. The pack
  # job assembles one package with all five, and one PackageReference works everywhere.
  native:
    name: Build CUI (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: native-windows
            path: native/cui.*
          # The library is built inside debian:11, the oldest image the package promises
          # to load on (glibc 2.31). Building on the runner narrows the promise without
          # anyone choosing it; the build fails if the produced libcui.so needs more.
          - os: ubuntu-22.04
            artifact: native-linux
            path: native/libcui.*
          - os: windows-11-arm
            artifact: native-windows-arm64
            path: native/cui.*
          - os: ubuntu-24.04-arm
            artifact: native-linux-arm64
            path: native/libcui.*
          - os: macos-latest
            artifact: native-macos
            path: native/libcui.*
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      # CUI's x11 backend includes Xlib headers; the runner image has none of them.
      - name: Ensure Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: bash tools/ci-linux-deps.sh libx11-dev

      - name: Build CUI (native artifacts)
        shell: pwsh
        env:
          CUI_GLIBC_BASELINE: '2.31'
        run: |
          if ($IsWindows) { ./native/build-native.ps1 }
          elseif ($IsMacOS) { bash native/build-native.sh }
          else { bash native/build-native-container.sh debian:11 }

      # The archive is only as trustworthy as what produced it, so the revision, the
      # compiler and the measured ABI travel with it.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
            native/native-provenance.txt

  pack:
    name: Pack and verify
    needs: native
    runs-on: windows-latest
    env:
      # One package cache location, so the cache step below and every restore agree.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7.0.1

      # Two tests read the CUI submodule's docs (the widget pages the skill folder
      # mirrors), and the job runs the whole suite to prove the packages work.
      - name: Checkout submodules (CUI)
        run: git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      # A tag run rebuilds the same package graph the branch's CI just built; key
      # the cache the way ci.yml does, so the two share it.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Build.props', 'src/CuiSharp.Templates/**/*.csproj', 'src/CuiSharp*/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # One directory per RID: Linux and macOS both build a libcui.a, so a shared
      # directory would have one archive overwrite the other.
      - name: Download the native artifacts (win-x64)
        uses: actions/download-artifact@v8.0.2
        with:
          name: native-windows
          path: artifacts/native/win-x64

      - name: Download the native artifacts (linux-x64)
        uses: actions/download-artifact@v8.0.2
        with:
          name: native-linux
          path: artifacts/native/linux-x64

      - name: Download the native artifacts (win-arm64)
        uses: actions/download-artifact@v8.0.2
        with:
          name: native-windows-arm64
          path: artifacts/native/win-arm64

      - name: Download the native artifacts (linux-arm64)
        uses: actions/download-artifact@v8.0.2
        with:
          name: native-linux-arm64
          path: artifacts/native/linux-arm64

      - name: Download the native artifacts (osx-arm64)
        uses: actions/download-artifact@v8.0.2
        with:
          name: native-macos
          path: artifacts/native/osx-arm64

      # The suite and the in-repo projects look for the host's library in native/,
      # which is where a local build leaves it. Only the Windows files go there: the
      # other RIDs stay in their own directories, because Linux and macOS both build
      # a libcui.a and one would overwrite the other.
      - name: Stage the host's native library for the test run
        shell: pwsh
        run: Copy-Item artifacts/native/win-x64/* native/

      # The two test projects and what they reference — not the whole solution:
      # the gallery and the benchmark suite were being built only to be ignored,
      # and their restores were the slowest third of this step. The pack step
      # builds whatever packing itself needs.
      #
      # blame-hang turns a silent wedge into a failure that names the test: one
      # release run lost seventeen minutes to a leg that printed nothing, and the
      # dump it leaves behind is the evidence a rerun would just burn again.
      - name: Test
        timeout-minutes: 15
        shell: pwsh
        run: |
          $blame = @('--blame-hang-timeout', '6m', '--blame-hang-dump-type', 'full')
          dotnet test @blame -c Release src/CuiSharp.Tests/CuiSharp.Tests.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test @blame -c Release src/CuiSharp.Templates/CuiSharp.App/CuiSharp.App.Tests/CuiSharp.App.Tests.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The release page is the changelog section for this version, so it has to exist and be dated
      # before anything is built or pushed: a tag whose section still says unreleased used to fail
      # only in the last job, after the packages were already on nuget.org. Both a tag and a manual
      # dispatch resolve their version here, the same way the pack step does.
      - name: Release notes exist for this version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if (-not $version) { throw 'no release version: tag v*.*.* or pass the version input' }

          $notes = pwsh tools/release-notes.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw "no release notes for $version" }
          "Release notes for **$version** found" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $notes | Write-Host

      # One step for all four packages, so the version and the native directories are
      # spelled once. `dotnet pack` builds the tool's output for PackAsTool.
      - name: Pack the four packages
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          $native = (Resolve-Path artifacts/native).Path
          $args = @(
            '-c', 'Release', '-o', 'artifacts/packages',
            "-p:CuiNativeWinDir=$native\win-x64\",
            "-p:CuiNativeWinArm64Dir=$native\win-arm64\",
            "-p:CuiNativeLinuxDir=$native\linux-x64\",
            "-p:CuiNativeLinuxArm64Dir=$native\linux-arm64\",
            "-p:CuiNativeOsxDir=$native\osx-arm64\"
          )
          if ($version) { $args += "-p:Version=$version" }

          foreach ($project in 'src/CuiSharp/CuiSharp.csproj',
                               'src/CuiSharp.Testing/CuiSharp.Testing.csproj',
                               'src/CuiSharp.Tools/CuiSharp.Tools.csproj',
                               'src/CuiSharp.Templates/CuiSharp.Templates.csproj') {
            dotnet pack $project @args
            if ($LASTEXITCODE) { throw "pack failed for $project" }
          }

      - name: Inspect every package
        shell: pwsh
        run: |
          # What each package must contain, keyed by id. A release that ships a
          # package without its native assets or its build targets is worse than
          # no release, so this fails instead of publishing.
          $required = @{
            'CuiSharp'          = @('lib/net10.0/CuiSharp.dll', 'build/CuiSharp.targets',
                                    'runtimes/native-provenance.txt',
                                    'analyzers/dotnet/cs/CuiSharp.Analyzers.dll',
                                    'analyzers/dotnet/cs/CuiSharp.CodeFixes.dll',
                                    'runtimes/win-x64/native/cui.dll', 'runtimes/win-x64/native/cui.lib',
                                    'runtimes/win-arm64/native/cui.dll', 'runtimes/win-arm64/native/cui.lib',
                                    'runtimes/linux-x64/native/libcui.so', 'runtimes/linux-x64/native/libcui.a',
                                    'runtimes/linux-arm64/native/libcui.so', 'runtimes/linux-arm64/native/libcui.a',
                                    'runtimes/osx-arm64/native/libcui.dylib', 'runtimes/osx-arm64/native/libcui.a')
            'CuiSharp.Testing'  = @('lib/net10.0/CuiSharp.Testing.dll')
            'CuiSharp.Tools'    = @('tools/net10.0/any/DotnetToolSettings.xml')
            'CuiSharp.Templates' = @('content/CuiSharp.App/.template.config/template.json',
                                     'content/CuiSharp.Mini/.template.config/template.json',
                                     'content/CuiSharp.Mini/MiniApp.cs')
          }

          $packages = Get-ChildItem artifacts/packages/*.nupkg
          if ($packages.Count -ne $required.Count) {
            throw "expected $($required.Count) packages, packed $($packages.Count): $($packages.Name -join ', ')"
          }

          foreach ($nupkg in $packages) {
            $id = $nupkg.Name -replace '\.\d+\..*\.nupkg$', ''
            if (-not $required.ContainsKey($id)) { throw "unexpected package: $($nupkg.Name)" }

            $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
            try {
              $names = $zip.Entries.FullName
              $names | Sort-Object | ForEach-Object { Write-Host "    $_" }
              if ($names -notcontains 'README.md') { throw "$id is missing README.md" }
              foreach ($entry in $required[$id]) {
                if ($names -notcontains $entry) { throw "$id is missing $entry" }
              }
            } finally { $zip.Dispose() }
            Write-Host "package OK: $($nupkg.Name)"
          }

          # The template pins the library version it shipped with; a release whose
          # template points at a version that is not this one scaffolds a solution
          # that cannot restore.
          $templates = Get-ChildItem artifacts/packages/CuiSharp.Templates.*.nupkg | Select-Object -First 1
          $version = $templates.Name -replace '^CuiSharp\.Templates\.(.*)\.nupkg$', '$1'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($templates.FullName)
          try {
            $entry = $zip.GetEntry('content/CuiSharp.App/.template.config/template.json')
            $json = (New-Object System.IO.StreamReader($entry.Open())).ReadToEnd() | ConvertFrom-Json
            $pinned = $json.symbols.CuiSharpVersion.defaultValue
            if ($pinned -ne $version) {
              throw "the template pins CuiSharp $pinned but this release is $version; update template.json"
            }
          } finally { $zip.Dispose() }
          Write-Host "template pins CuiSharp $version"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages
          path: artifacts/packages/*

  publish:
    name: Push to NuGet
    needs: pack
    runs-on: windows-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-packages
          path: packages

      # NuGet trusted publishing. The account name is not a credential — the API key
      # comes from an OIDC exchange — so it is pinned here instead of in a secret.
      # What nuget.org has to know, once, is a trusted publishing policy for this
      # repository, this workflow file and the `nuget` environment.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: slaveoftime

      - name: Push
        shell: pwsh
        run: |
          Get-ChildItem packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE) { throw "push failed for $($_.Name)" }
          }

      - name: Record what happened
        shell: pwsh
        run: |
          $pushed = (Get-ChildItem packages/*.nupkg).Name -join ', '
          "NuGet: attempted as **slaveoftime** for $pushed" >> $env:GITHUB_STEP_SUMMARY

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-packages
          path: packages

      # The release page is the changelog section for this tag, not a second file that can drift
      # from it: a version with no section, or one still under [Unreleased], fails here.
      - name: Release notes
        shell: pwsh
        run: pwsh tools/release-notes.ps1 -Version '${{ github.ref_name }}' -OutFile release-notes.md

      - uses: softprops/action-gh-release@v3.0.4
        with:
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            packages/*.nupkg
            packages/*.snupkg
